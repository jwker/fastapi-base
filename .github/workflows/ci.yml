name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Lint
        run: uv run ruff check app tests scripts
      - name: Format check
        run: uv run ruff format --check app tests scripts
      - name: Test
        run: PYTHONPATH=. uv run pytest

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fastapi
          POSTGRES_PASSWORD: fastapi
          POSTGRES_DB: fastapi
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fastapi -d fastapi"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://fastapi:fastapi@localhost:5433/fastapi
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: e2e-secret-key-for-ci
      ALLOWED_ORIGINS: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend deps
        working-directory: backend
        run: uv sync
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Prepare backend DB
        working-directory: backend
        run: |
          PYTHONPATH=. uv run alembic upgrade head
          PYTHONPATH=. uv run python scripts/init_db.py
      - name: Start backend
        working-directory: backend
        run: |
          PYTHONPATH=. nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0 || sleep 2
          done
          echo "backend not ready"; tail -30 /tmp/backend.log; exit 1
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Start frontend (vite preview)
        working-directory: frontend
        run: |
          nohup pnpm exec vite preview --port 4173 --strictPort > /tmp/frontend.log 2>&1 &
      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ && exit 0 || sleep 2
          done
          echo "frontend not ready"; tail -30 /tmp/frontend.log; exit 1
      - name: Run E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:4173
        run: pnpm e2e
